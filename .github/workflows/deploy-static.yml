name: Deploy EIL Static Research Site

on:
  push:
    branches: [main, hermes-research-engine]
    paths:
      - "frontend/build-static.mjs"
      - "frontend/snapshot.json"
      - "backend/src/eil_schema.sql"
      - "backend/src/eil_content.rs"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static research site
        run: node build-static.mjs
        env:
          EIL_SNAPSHOT_URL: ${{ vars.EIL_SNAPSHOT_URL || 'https://emergent-interaction-lab.fly.dev/api/eil/public-snapshot' }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist-static
          publish_branch: gh-pages
          user_name: rfi-irfos-bot
          user_email: bot@rfi-irfos.dev
