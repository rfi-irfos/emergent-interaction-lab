<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var q = window.location.search;
        if (q && q[1] === 'p') {
          var params = q.slice(1).split('&');
          var path = params[0].slice(2).replace(/~and~/g, '&');
          var query = params[1] ? '?' + params[1].slice(2).replace(/~and~/g, '&') : '';
          var hash = window.location.hash || '';
          window.history.replaceState(null, null, window.location.pathname + path + query + hash);
        }
      })();
    </script>
    <script>
      (function() {
        var m = /[?&]theme=(light|dark|hc)/.exec(window.location.search)
        if (m) localStorage.setItem('rfi-theme', m[1])
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%eil-official-mark-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Site-wide sans, actually loaded (previously the CSS named "Inter"
         but never linked it, so every visitor silently fell through to
         their OS's default UI font - Segoe UI, San Francisco, Roboto -
         which read as generic/boring, flagged live. One family, full
         100-900 weight range, replaces Inter everywhere per the existing
         "no font-mixing" rule - not a font pairing, just a better single
         choice with more character. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap" rel="stylesheet" />
    <!-- Static fallback shown until React hydrates and PublicSite's own
         document.title effect takes over from content.meta.title (see
         PublicSite.tsx) — was left as Vite's literal scaffold placeholder
         since this project's init, so every visitor saw a bare "frontend"
         tab title for however long the JS bundle took to load. -->
    <title>Emergent Interaction Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
